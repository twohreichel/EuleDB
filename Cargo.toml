[workspace]
resolver = "3"
members = ["crates/*"]

# Inherited by every member with `field.workspace = true`, so the publish metadata of AC-65 is stated
# once instead of drifting between crates.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91.0"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/twohreichel/EuleDB"
categories = ["database-implementations", "database"]
keywords = ["database", "embedded", "hybrid-search", "vector-search", "local-first"]

# Line tables instead of full DWARF. The dependency tree is 477 crates including datafusion, and full
# debug info for that is several gigabytes of disk and a matching peak in memory during linking — enough
# that the aarch64 CI runners, which have less of both than the x86_64 ones, were killed mid-build.
# Line tables still give file and line in a backtrace, which is what a test failure needs. Override
# locally if you need a step debugger.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[workspace.dependencies]
# The interchange contract. arrow-schema and arrow-array rather than the `arrow` facade: the storage
# layer needs the schema types and RecordBatch, not the compute kernels, the CSV reader or the FFI
# layer. A consumer using the facade gets the same types, because the facade re-exports these.
#
# The version is NOT ours to choose — it is whatever `lance` below depends on, currently 58. Two arrow
# majors in one tree are two incompatible type worlds: a RecordBatch built against 59 cannot be handed
# to a lance that was built against 58, and the mismatch surfaces as a type error, not as a warning.
# The exact pin on lance is what keeps this alignment from drifting under a patch release.
# Envelope encryption (ADR-002). RustCrypto throughout: aes-gcm carries an NCC Group audit with no
# significant findings, and argon2 is the reference implementation of the variant the RFC recommends.
aes-gcm = "0.11"
argon2 = "0.5"
# 32 random bytes from the operating system, and nothing more. The full rand stack would be a
# generator, a seeding strategy and a distribution API for one call that must not be reproducible.
getrandom = "0.3"
# Pinned to what the on-disk format uses, for the same reason arrow is: the encrypting layer implements
# this crate's ObjectStore trait and hands the result back to the format, so two versions would be two
# incompatible traits rather than a duplicate.
async-trait = "0.1"
bytes = "1"
object_store = "0.13"
# The URL type the format's provider contract is expressed in.
url = "2"
arrow-array = "58"
# The on-disk format, pinned exactly (ADR-001). default-features = false is load-bearing, not tidiness:
# lance enables aws, azure, gcp, oss, tencent, tos, goosefs, huggingface and geo by default — every
# cloud object-store backend there is. This database's entire premise is that nothing leaves the
# machine, and its resident-memory ceiling is 50 MB idle, so linking a fleet of cloud SDKs and an HTTP
# stack in would contradict both.
# lance generates code from protobuf definitions at build time, so `protoc` has to be on PATH. Its
# `protoc` feature would build the compiler from source instead — but that needs cmake and a C++
# toolchain, and rebuilds protobuf on every clean build across eight CI legs. Requiring the small
# prebuilt binary and installing a pinned one in CI is the cheaper trade. CONTRIBUTING.md says so.
lance = { version = "=10.0.0", default-features = false }
# The provider trait the encrypted URI scheme is registered through. `lance` does not re-export it, and
# it must be the SAME version as lance or the trait implemented here is a different trait.
lance-io = { version = "=10.0.0", default-features = false }
arrow-schema = "58"
# TryStreamExt, to collect a scan. Already in the tree through lance, so this adds nothing.
futures-util = { version = "0.3", default-features = false }
tempfile = "3"
# Capturing the delete announcement in a test. A dev-dependency: a library emits events, it does not
# decide how they are collected.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
thiserror = "2"
# Structured diagnostics. tracing rather than log because this layer is async, because the format
# already emits tracing spans so an application here almost certainly has a subscriber, and because a
# delete's count and predicate belong in named fields rather than interpolated into a message.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# Key material must not linger in freed memory, where a core dump or a swap file would reach it.
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false }
toml = "0.9"

[workspace.lints.clippy]
# The public API returns failures as values and never aborts its host process (AC-71). Denying the
# two shortcuts here, from the first crate, is cheaper than retrofitting the habit across the chain.
# Tests are exempt via clippy.toml — an unwrap in a test is an assertion.
unwrap_used = "deny"
expect_used = "deny"
