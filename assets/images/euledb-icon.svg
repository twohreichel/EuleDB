  <!-- Nachtblauer Hintergrund -->
  <rect x="0" y="0" width="128" height="128" rx="30" fill="#0D2038"/>

  <!-- Ohrbüschel -->
  <path d="M36 42 L26 22 L52 32 Z" fill="#3C6FA6"/>
  <path d="M92 42 L102 22 L76 32 Z" fill="#3C6FA6"/>

  <!-- Körper = Datenbank-Zylinder -->
