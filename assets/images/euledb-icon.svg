  <!-- Augen -->
  <circle cx="47" cy="52" r="14" fill="#F5B841"/>
  <circle cx="81" cy="52" r="14" fill="#F5B841"/>
  <circle cx="47" cy="52" r="6" fill="#0D2038"/>
  <circle cx="81" cy="52" r="6" fill="#0D2038"/>
  <circle cx="50" cy="49" r="2.4" fill="#FFF6E3"/>
  <circle cx="84" cy="49" r="2.4" fill="#FFF6E3"/>

  <!-- Schnabel -->
  <path d="M58 66 h12 L64 76 Z" fill="#F08A24"/>
