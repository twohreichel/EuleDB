[package]
name = "euledb-storage"
description = "Storage layer for EuleDB. Keeps the on-disk format behind a trait boundary so no other crate depends on it."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
arrow-array.workspace = true
async-trait.workspace = true
bytes.workspace = true
getrandom.workspace = true
hmac.workspace = true
sha2.workspace = true
futures-util.workspace = true
lance.workspace = true
lance-io.workspace = true
lance-core.workspace = true
lance-index.workspace = true
object_store.workspace = true
roaring.workspace = true
url.workspace = true
arrow-schema.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The real model in the auto-embedding tests: a fake embedder would prove the wiring calls something,
# not that a changed text produces a changed vector.
euledb-embed.workspace = true
# Forging a record in the audit test: an attacker who can write the log can also compute its hashes,
# so the test has to be able to as well.
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
