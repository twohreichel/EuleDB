# The minimum supported Rust version, derived rather than chosen: the maximum `rust-version` across
# the pinned dependencies of the specification's technology stack — lance 1.91.0, tract 1.91, tantivy
# 1.86, arrow 1.85, aes-gcm 1.85. CI verifies against this channel AND against stable (AC-11), so
# raising it is a deliberate, visible act.
[toolchain]
channel = "1.91.0"
components = ["rustfmt", "clippy"]
